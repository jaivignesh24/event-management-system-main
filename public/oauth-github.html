<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize Aurora Fest - GitHub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f6f8fa;
    }
    .card {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 32px;
      width: 400px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
    }
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .logo-img {
      width: 48px;
      height: 48px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #24292f;
      margin: 0 0 16px 0;
    }
    p {
      font-size: 14px;
      color: #57606a;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #2da44e;
      color: white;
      border: 1px solid rgba(27, 31, 36, 0.15);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logos">
      <svg class="logo-img" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 01-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.35 3.12.88.01.64.01 1.24.01 1.35 0 .21-.16.47-.55.38A8.013 8.013 0 010 8c0-4.42 3.58-8 8-8z"></path>
      </svg>
    </div>
    <h1>Authorize Aurora Fest</h1>
    <p>Aurora Fest 2026 wants to access your GitHub public profile information (name, avatar, and email address).</p>
    <button class="btn" onclick="authorize()">Authorize github-user</button>
  </div>

  <script>
    function authorize() {
      window.opener.postMessage({
        source: 'oauth-github',
        user: {
          name: 'Developer Student',
          email: 'github.dev@aurora.edu.in',
          avatar: 'https://avatars.githubusercontent.com/u/9919?v=4'
        }
      }, window.location.origin);
      window.close();
    }
  </script>
</body>
</html>
