<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <style>
    body {
      font-family: Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f4f9;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 400;
      color: #1f1f1f;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 16px;
      color: #444746;
      margin: 0 0 24px 0;
    }
    .account-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e3e3e3;
      cursor: pointer;
      text-align: left;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .account-item:hover {
      background-color: #f7f9fc;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ea4335;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 18px;
    }
    .info {
      flex: 1;
    }
    .name {
      font-size: 14px;
      font-weight: 500;
      color: #1f1f1f;
    }
    .email {
      font-size: 12px;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    <h1>Choose an account</h1>
    <p>to continue to Aurora Fest 2026</p>

    <div class="account-item" onclick="selectAccount('Rohit Kumar', 'rohit.kumar@gmail.com', 'R')">
      <div class="avatar" style="background-color: #4285F4;">R</div>
      <div class="info">
        <div class="name">Rohit Kumar</div>
        <div class="email">rohit.kumar@gmail.com</div>
      </div>
    </div>

    <div class="account-item" onclick="selectAccount('Priya Sharma', 'priya.sharma@gmail.com', 'P')">
      <div class="avatar" style="background-color: #34A853;">P</div>
      <div class="info">
        <div class="name">Priya Sharma</div>
        <div class="email">priya.sharma@gmail.com</div>
      </div>
    </div>
  </div>

  <script>
    function selectAccount(name, email, initials) {
      window.opener.postMessage({
        source: 'oauth-google',
        user: {
          name: name,
          email: email,
          avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=f97316&color=fff`
        }
      }, window.location.origin);
      window.close();
    }
  </script>
</body>
</html>
