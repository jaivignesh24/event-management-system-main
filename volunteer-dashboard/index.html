<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Fest Portal - Router</title>
  <link rel="stylesheet" href="main.css">
  
  <script type="module">
    import { getCurrentUser } from './api.js';

    // Immediate role-based routing check
    async function checkRoleAndRedirect() {
      try {
        const user = await getCurrentUser();
        
        if (user && user.role === 'student') {
          window.location.replace('student-dashboard.html');
        } else if (user && (user.role === 'volunteer' || user.role === 'club_leader' || user.role === 'admin' || user.role === 'superadmin')) {
          window.location.replace('volunteer-dashboard.html');
        } else {
          // Fallback if role is undefined
          window.location.replace('student-dashboard.html');
        }
      } catch (err) {
        console.error('Routing error:', err);
        // Default to student if something fails
        window.location.replace('student-dashboard.html');
      }
    }

    // Run check immediately
    checkRoleAndRedirect();
  </script>

  <style>
    .router-loading {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-heading);
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      border-top-color: var(--color-purple);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="router-loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>Checking authorization and loading portal...</p>
  </div>
</body>
</html>
